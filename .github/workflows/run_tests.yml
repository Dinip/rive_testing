name: Run Tests
on:
  pull_request:
    types:
      - opened
      - synchronize

jobs:
  run_tests:
    name: Run Tests
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install C++ dependencies
        run: sudo apt update && sudo apt-get -y install build-essential clang libclang-rt-14-dev g++ llvm-dev uuid-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev freeglut3-dev zlib1g-dev

      - name: Setup flutter
        uses: subosito/flutter-action@v2
        with: 
          flutter-version: 3.35.6

      - name: Install dependencies
        shell: bash
        run: |
          flutter pub get

      - name: Setup Rive Native
        shell: bash
        run: |
          dart run rive_native:setup --verbose --clean --build --platform linux

      - name: Run tests
        shell: bash
        run: |
          flutter test --no-pub --no-track-widget-creation --update-goldens